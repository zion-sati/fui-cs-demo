<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuiCs application</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: light dark; }
    html, body { height: 100%; overflow: hidden; background: #f8fafc; }
    @media (prefers-color-scheme: dark) { html, body { background: #040a14; } }
    .canvas-shell { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    canvas:focus, canvas:focus-visible { outline: none; }
  </style>
</head>
<body>
  <div class="canvas-shell" data-effindom-canvas-size-source>
    <canvas id="fui-canvas"></canvas>
  </div>
  <!-- Every route's folder holds this page, so it loads the shell from the site's base; a route's own relative
       addresses (its assets) resolve from its folder. -->
  <script src="/fui-app.js"></script>
  <script src="/bridge.js"></script>
  <script type="module" src="/harness.js"></script>
</body>
</html>
